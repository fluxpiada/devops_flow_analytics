[project]
name = "devops_flow"
version = "0.2.0"
description = "Flow- en sprintmetrics van een Jira-project, als tabellen voor Excel"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "urllib3>=2.0",
    "openpyxl>=3.1",
]

[project.scripts]
devops-flow = "devops_flow.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devops_flow"]
